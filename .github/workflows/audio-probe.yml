# Measures the audio with the real voices: background noise of each engine and of a mastered episode, and
# every voice's pitch, brightness and timbre (to cast voices that sound clearly different). Run it from
# Actions → Audio probe; it also runs on a pull request that changes audio code. Results are in the log and
# the "audio-probe" artifact (report.json and episode MP3s).
name: Audio probe

on:
  workflow_dispatch:
    inputs:
      gemini_voices:
        description: Also measure every Gemini voice (uses a day's free Gemini speech allowance)
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/worker/scripts/audio-probe.ts
      - packages/ai/src/audio/**
      - packages/shared/src/voice-traits.ts
      - packages/ai/src/tts/**
      - .github/workflows/audio-probe.yml

permissions:
  contents: read

# onnxruntime-node (used by the Kokoro voice engine) would download GPU binaries on install; that download
# now fails (404), which makes npm drop the whole optional Kokoro package. ThinkMade runs on CPU only.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
      PROBE_OUT: ${{ github.workspace }}/probe
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PROBE_GEMINI_VOICES: ${{ inputs.gemini_voices && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: .models
          key: thinkmade-models-v1
      - run: npm ci
        env:
          SKIP_SPEECH_MODEL: '1'
      - name: Probe
        run: npx tsx apps/worker/scripts/audio-probe.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-probe
          path: probe/*.mp3
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-probe-report
          path: probe/report.json
          retention-days: 14
