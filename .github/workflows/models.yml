# Lists the language models each provider offers this account (Groq, Gemini and OpenRouter's free
# models), so ThinkMade's fallback chains are built from names that exist. Run it from Actions → Models,
# (manual only, to save the private repository's Actions minutes).
name: Models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List models
        run: npx --yes tsx@4 scripts/list-models.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Chat latency
        run: npx --yes tsx@4 scripts/chat-latency.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
