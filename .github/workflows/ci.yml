name: CI

# Manual only (Actions -> CI -> Run workflow). Runs on this private repository use the account's 2,000
# free Actions minutes and overage is billed, so pull requests no longer start it. Run the same checks
# locally: npm run lint && npm run typecheck && npm test.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Dependency audit (fail on high or critical)
        run: npm audit --audit-level=high
      - name: Vercel build output
        run: npm run build:vercel
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      - name: End-to-end tests (iPhone, Pixel, desktop profiles)
        run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the pull request's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
