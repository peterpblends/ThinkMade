# Renders the short sample listeners hear when picking a voice on the Create page, for every available voice
# that doesn't have one yet. The worker also does this after each run, so this is only needed to fill them
# in at once (for example after adding voices). Run it from Actions → Voice samples → Run workflow.
name: Voice samples

on:
  workflow_dispatch:
    inputs:
      check:
        description: Also transcribe every sample to check each voice speaks clear English
        type: boolean
        default: false
      languages:
        description: Only check these languages (e.g. es,fr); empty checks all
        default: ''

permissions:
  contents: read

concurrency:
  group: thinkmade-voice-samples
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VOICE_SAMPLES_CHECK: ${{ inputs.check && '1' || '0' }}
      VOICE_SAMPLES_LANGUAGES: ${{ inputs.languages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: .models
          key: thinkmade-models-v1
      - run: npm ci
        env:
          SKIP_SPEECH_MODEL: '1'
      - name: Render voice samples
        run: npm run voice-samples -w apps/worker
