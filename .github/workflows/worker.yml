# ThinkMade podcast worker on GitHub Actions: free and needs no card.
# The API starts a run when someone creates a podcast (repository_dispatch), a run drains the queue and
# exits (waiting up to 40 minutes for jobs paused by a rate limit). Every 3 hours a quick database check
# (under a minute) starts the full run only if a job is due, such as one that waited for a daily AI
# allowance to reset. One run at a time, so a podcast created mid-run is picked up by the next run.
# Repository secrets: DATABASE_URL, GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY (optional backup), S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, RESEND_API_KEY (optional), EMAIL_FROM (optional).
name: Worker

# Automatic runs happen only while the repository is public, where GitHub-hosted minutes are free and
# unlimited. If it is ever made private again they are skipped (a skipped job uses no minutes), because
# a private repository gets 2,000 minutes a month and overage is billed. Manual runs always work.
on:
  repository_dispatch:
    types: [thinkmade-jobs]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: thinkmade-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NODE_ENV: production
      WORKER_DRAIN: 'true'
      WORKER_DRAIN_MINUTES: '300'
      WORKER_DRAIN_WAIT_SECONDS: '2400'
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - name: Anything due? (scheduled runs only)
        id: due
        if: github.event_name == 'schedule'
        # The runner's psql doesn't understand some connection options (Neon adds channel_binding), so they
        # are dropped for this quick check. If the check itself fails, the worker runs anyway: a podcast
        # waiting to resume must never be stranded by the check.
        run: |
          url=$(printf '%s' "$DATABASE_URL" | sed -E 's/([?&])channel_binding=[^&]*&?/\1/; s/[?&]$//')
          if n=$(psql "$url" -tAc "select count(*) from generation_job where (status = 'queued' and run_after <= now() + interval '40 minutes') or (status = 'running' and locked_until < now())" 2>/dev/null); then
            n=$(printf '%s' "$n" | tr -d '[:space:]')
          else
            echo "::warning::Couldn't check the queue; running the worker anyway."
            n=unknown
          fi
          echo "Jobs due: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.due.outputs.count != '0'
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.due.outputs.count != '0'
        with:
          node-version: 22
          cache: npm
      - name: Cache speech and embedding models
        if: github.event_name != 'schedule' || steps.due.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: .models
          key: thinkmade-models-v1
      - run: npm ci
        if: github.event_name != 'schedule' || steps.due.outputs.count != '0'
        env:
          SKIP_SPEECH_MODEL: '1'
      - name: Run queued podcast jobs
        if: github.event_name != 'schedule' || steps.due.outputs.count != '0'
        run: npm run start -w apps/worker
