# ThinkMade podcast worker on GitHub Actions: free and needs no card.
# The API starts a run when someone creates a podcast (repository_dispatch), a run drains the queue and
# exits, and a run every 4 hours picks up jobs that were waiting out a rate limit. One run at a time.
# Repository secrets: DATABASE_URL, GROQ_API_KEY, OPENROUTER_API_KEY, S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, RESEND_API_KEY (optional), EMAIL_FROM (optional).
name: Worker

on:
  repository_dispatch:
    types: [thinkmade-jobs]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

concurrency:
  group: thinkmade-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NODE_ENV: production
      WORKER_DRAIN: 'true'
      WORKER_DRAIN_MINUTES: '300'
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache speech and embedding models
        uses: actions/cache@v4
        with:
          path: .models
          key: thinkmade-models-v1
      - run: npm ci
        env:
          SKIP_SPEECH_MODEL: '1'
      - name: Run queued podcast jobs
        run: npm run start -w apps/worker
